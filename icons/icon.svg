<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#D70015" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M64 14 L108 30 C108 72 88 104 64 116 C40 104 20 72 20 30 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Shield Inner Border Highlight -->
  <path d="M64 20 L102 34 C102 70 84 98 64 109 C44 98 26 70 26 34 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.25)" 
        stroke-width="3" />

  <!-- YouTube Play Triangle Center -->
  <polygon points="54,46 54,82 84,64" fill="#FFFFFF" />

  <!-- Diagonal Ban Slash -->
  <line x1="36" y1="36" x2="92" y2="92" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
</svg>
