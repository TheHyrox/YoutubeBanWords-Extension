<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Ban Words</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <svg class="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span class="brand-title">YouTube Ban Words</span>
      </div>
      <label class="switch" title="Toggle filtering">
        <input type="checkbox" id="toggleFilter" checked>
        <span class="slider"></span>
      </label>
    </header>

    <div class="status-banner" id="statusBanner">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">Filtering Active</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="blockedCount">0</div>
        <div class="stat-label">Hidden on Page</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="wordsCount">0</div>
        <div class="stat-label">Banned Words</div>
      </div>
    </div>

    <section class="quick-add">
      <form id="quickAddForm">
        <div class="input-group">
          <input
            type="text"
            id="quickWordInput"
            placeholder="Quick add keyword..."
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" id="quickAddBtn" title="Add keyword">Add</button>
        </div>
      </form>
      <div id="quickAddNotice" class="notice"></div>
    </section>

    <footer class="footer">
      <button id="openOptionsBtn" class="btn-secondary">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Full Word List & Settings
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
